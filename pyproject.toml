[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krag"
version = "0.1.0"
description = "Knowledge-chain Retrieval Augmented Generation — provenance-aware, trust-scored, culturally-contextual RAG"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Putra Nasution", email = "poetra@gmail.com"}
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "provenance",
    "trust-scoring",
    "isnad",
    "knowledge-graph",
    "ai",
    "llm",
    "southeast-asia"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
krag = "krag.cli:main"
dewan = "dewan_council.cli:main"

[project.urls]
Homepage = "https://github.com/putranasution/krag"
Documentation = "https://github.com/putranasution/krag#readme"
Repository = "https://github.com/putranasution/krag.git"
Issues = "https://github.com/putranasution/krag/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/krag", "src/dewan_council"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
